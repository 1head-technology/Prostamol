name: Deploy Prostamol

on:
    push:
        branches:
            - main
    workflow_dispatch:

concurrency:
    group: prostamol-production
    cancel-in-progress: true

jobs:
    verify:
        runs-on: ubuntu-latest
        services:
            postgres:
                image: postgres:17
                env:
                    POSTGRES_DB: prostamol
                    POSTGRES_USER: postgres
                    POSTGRES_PASSWORD: postgres
                ports:
                    - 5432:5432
                options: >-
                    --health-cmd "pg_isready -U postgres -d prostamol"
                    --health-interval 10s
                    --health-timeout 5s
                    --health-retries 5
        env:
            DB_HOST: localhost
            DB_PORT: 5432
            DB_NAME: prostamol
            DB_USERNAME: postgres
            DB_PASSWORD: postgres
        steps:
            - name: Check out repository
              uses: actions/checkout@v4

            - name: Set up Java
              uses: actions/setup-java@v4
              with:
                  distribution: temurin
                  java-version: 25
                  cache: maven

            - name: Run tests and package
              run: ./mvnw --batch-mode clean package

    deploy:
        needs: verify
        runs-on: ubuntu-latest
        environment: production
        steps:
            - name: Check out repository
              uses: actions/checkout@v4

            - name: Set up Java
              uses: actions/setup-java@v4
              with:
                  distribution: temurin
                  java-version: 25
                  cache: maven

            - name: Build deployment artifact
              run: ./mvnw --batch-mode clean package -DskipTests

            - name: Configure SSH
              env:
                  DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
                  DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
              run: |
                  install -m 700 -d "$HOME/.ssh"
                  printf '%s\n' "$DEPLOY_SSH_KEY" > "$HOME/.ssh/id_ed25519"
                  chmod 600 "$HOME/.ssh/id_ed25519"
                  printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"

            - name: Upload Prostamol
              env:
                  DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
                  DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
                  DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
              run: |
                  ssh "$DEPLOY_USER@$DEPLOY_HOST" "mkdir -p '$DEPLOY_PATH'"
                  rsync -az --exclude '.git/' --exclude '.idea/' --exclude 'target/' ./ "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/"
                  rsync -az target/ "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/target/"

            - name: Clean up old application containers
              env:
                  DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
                  DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
              run: |
                  ssh "$DEPLOY_USER@$DEPLOY_HOST" \
                    "docker rm -f prostamol spring-backend 2>/dev/null || true"

            - name: Rebuild and restart Prostamol
              env:
                  DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
                  DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
                  DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
              run: |
                  ssh "$DEPLOY_USER@$DEPLOY_HOST" "cd '$DEPLOY_PATH' && docker compose -f docker-compose.production.yml up -d --build --remove-orphans"
