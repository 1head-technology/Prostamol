spring.application.name=Prostamol

spring.config.import=optional:file:.env[.properties]

# PostgreSQL
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:prostamol}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# JWT
jwt.secret=${JWT_SECRET:my-super-secret-key-that-is-at-least-32-bytes-long-for-hs256}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}


# WebAuthn: RP ID is the frontend domain; origins are exact browser origins.
passkey.rp-id=${PASSKEY_RP_ID:localhost}
passkey.rp-name=${PASSKEY_RP_NAME:Prostamol}
passkey.origins=${PASSKEY_ORIGINS:http://localhost:3000}

# Enable Banking (private key stays on the server; redirect is a frontend route).
enable-banking.enabled=${ENABLE_BANKING_ENABLED:false}
enable-banking.application-id=${ENABLE_BANKING_APPLICATION_ID:}
enable-banking.private-key-path=${ENABLE_BANKING_PRIVATE_KEY_PATH:}
enable-banking.redirect-url=${ENABLE_BANKING_REDIRECT_URL:}
enable-banking.history-days=${ENABLE_BANKING_HISTORY_DAYS:90}
enable-banking.sync-enabled=${ENABLE_BANKING_SYNC_ENABLED:true}
enable-banking.sync-delay-ms=${ENABLE_BANKING_SYNC_DELAY_MS:21600000}
