services:
    prostamol:
        build:
            context: .
            dockerfile: Dockerfile
        image: prostamol
        container_name: prostamol
        restart: unless-stopped
        env_file:
            - .env
        ports:
            - "${PROSTAMOL_HTTP_PORT:-8080}:8080"
        extra_hosts:
            - "host.docker.internal:host-gateway"
